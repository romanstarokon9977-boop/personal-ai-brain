name: Personal AI Brain CI

on:
  push:
    branches:
      - "ci/**"
      - "work/**"
      - "development/**"
      - "feature/**"
      - "feat/**"
      - "fix/**"
      - "main"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brain-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    timeout-minutes: 15
    env:
      # brain.py requires a non-empty key at import time.
      # Tests mock network calls; this is not a real credential.
      OPENROUTER_API_KEY: ci-dummy-key-not-a-secret

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile project modules and test modules
        run: |
          python -m py_compile \
            privacy_policy.py test_privacy_policy.py test_cpa_privacy.py \
            brain.py git_readonly.py test_git_readonly.py project_context.py context_personalization.py test_context_personalization.py test_project_context.py test_chat_recall_domains.py test_private_context_policy.py test_semantic_memory_cli.py execution_intent.py autonomy_controller.py test_autonomy_controller.py test_tool_bridge_autonomy.py test_tool_bridge.py test_tool_bridge_failure_guard.py test_execution_intent.py verifier.py goal_verifier.py planner.py task_manager.py execution_engine.py chat_system.py chat_recall.py input_collector.py \
            memory/memory_core.py memory/fact_extractor.py memory/consolidation.py memory/semantic_consolidation.py memory/semantic_guardrails.py memory/guarded_semantic_consolidation.py \
            memory/fact_frame_extractor.py memory/local_embedding_provider.py \
            memory/lifecycle.py memory/backup_restore.py memory/read_only_audit.py \
            mcp_bridge.py tool_registry.py context_manager.py \
            skills_manager.py tool_catalog.py tool_proposals.py tool_proposal_manager.py tool_proposal_commands.py mcp_server_catalog.py tool_error_handler.py test_tool_proposal_manager.py test_tool_proposal_runtime.py test_phase4_runtime_integration.py \
            self_inspection.py module_manager.py update_manager.py \
            brain_auto_update.py test_brain_auto_update.py \
            test_chat_recall_unit.py test_chat_recall_domains.py test_project_context.py test_chat_system_domains.py test_fact_extractor_queue.py test_tool_registry_contract.py \
            test_update_manager.py test_empty_cooldown.py \
            test_verifier_tool_result.py test_verifier_file_postcondition.py \
            test_goal_verifier.py test_task_manager.py test_execution_engine.py test_model_error_diagnostics.py \
            test_candidate_id_resolution.py test_memory_extraction_safety.py \
            test_fact_refinement_safety.py test_cpa_publish_safety.py \
            test_cpa_bridge_integration.py test_verifier_text.py \
            test_fallback_dedup.py test_input_collector.py \
            test_memory_protection.py test_memory_consolidation.py test_memory_semantic_consolidation.py test_guarded_semantic_consolidation.py \
            test_p3_2_4_semantic_guardrails.py test_semantic_guardrails.py test_p3_2_4_5_semantic_guard_safety.py \
            test_p3_2_4_6_ingestion.py test_fact_frame_extractor.py test_local_embedding_provider.py test_p3_2_4_9_provider_integration.py \
            test_memory_lifecycle.py test_memory_backup_restore.py test_read_only_memory_audit.py test_module_manager.py \
            test_self_inspection.py test_shell_safety.py \
            test_mcp_timeout.py test_tool_run_tests.py \
            test_integration_module_manager.py \
            test_integration_self_inspection.py \
            self_improvement/__init__.py self_improvement/core.py self_improvement/store.py self_improvement/commands.py test_self_improvement.py

      - name: Run isolated unittest modules
        shell: bash
        run: |
          set -euo pipefail
          for test_module in \
            test_privacy_policy \
            test_cpa_privacy \
            test_autonomy_controller \
            test_git_readonly \
            test_tool_bridge_autonomy \
            test_tool_bridge_failure_guard \
            test_execution_intent \
            test_input_collector \
            test_memory_protection \
            test_memory_consolidation \
            test_memory_lifecycle \
            test_memory_backup_restore \
            test_read_only_memory_audit \
            test_memory_semantic_consolidation \
            test_guarded_semantic_consolidation \
            test_p3_2_4_semantic_guardrails \
            test_p3_2_4_5_semantic_guard_safety \
            test_p3_2_4_6_ingestion \
            test_fact_frame_extractor \
            test_local_embedding_provider \
            test_p3_2_4_9_provider_integration \
            test_semantic_guardrails \
            test_module_manager \
            test_self_inspection \
            test_fallback_dedup \
            test_update_manager \
            test_verifier_tool_result \
            test_verifier_file_postcondition \
            test_goal_verifier \
            test_task_manager \
            test_execution_engine \
            test_model_error_diagnostics \
            test_planner \
            test_candidate_id_resolution \
            test_memory_extraction_safety \
            test_fact_refinement_safety \
            test_cpa_publish_safety \
            test_cpa_bridge_integration \
            test_verifier_text \
            test_brain_auto_update \
            test_tool_registry_contract \
            test_chat_recall_unit \
            test_chat_recall_domains \
            test_context_personalization \
            test_private_context_policy \
            test_semantic_memory_cli \
            test_project_context \
            test_chat_system_domains \
            test_fact_extractor_queue \
            test_shell_safety \
            test_mcp_timeout \
            test_tool_run_tests \
            test_integration_module_manager \
            test_integration_self_inspection \
            test_phase4_infrastructure \
            test_tool_proposal_manager \
            test_tool_proposal_runtime \
            test_phase4_runtime_integration \
            test_self_improvement
          do
            echo "::group::${test_module}"
            python -m unittest -v "${test_module}"
            echo "::endgroup::"
          done

      - name: Run targeted empty cooldown integration script
        run: python test_empty_cooldown.py

      - name: Run full unittest discovery
        run: python -m unittest discover -v
